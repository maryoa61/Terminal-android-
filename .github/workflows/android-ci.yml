name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: dist/   # اگر پروژه CRA است build/ ، اگر Next.js است .next/ یا out/
          if-no-files-found: warn
